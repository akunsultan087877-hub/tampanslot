<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tampan Slot</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
overflow:hidden;
background:#050d1f;
padding:15px;
position:relative;
}

/* ===== LATAR BIRU DARK ===== */
.bg-animation{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-3;
background:
radial-gradient(circle at 20% 30%, rgba(0,80,200,0.35) 0%, transparent 45%),
radial-gradient(circle at 80% 20%, rgba(0,140,255,0.25) 0%, transparent 40%),
radial-gradient(circle at 70% 80%, rgba(0,60,180,0.3) 0%, transparent 45%),
radial-gradient(circle at 30% 70%, rgba(0,100,220,0.2) 0%, transparent 40%),
#050d1f;
animation: bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse{
0%{ filter:hue-rotate(0deg) brightness(1); }
100%{ filter:hue-rotate(10deg) brightness(1.12); }
}

/* Grid / web biru */
.web{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
background-image:
linear-gradient(rgba(0,140,255,0.06) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,140,255,0.06) 1px, transparent 1px);
background-size:55px 55px;
animation: webMove 20s linear infinite;
opacity:0.7;
}
@keyframes webMove{
0%{ background-position:0 0; }
100%{ background-position:55px 55px; }
}

/* Cahaya biru bergerak */
.glow{
position:fixed;
width:300px;
height:300px;
border-radius:50%;
filter:blur(80px);
z-index:-1;
opacity:0.45;
animation: floatGlow 12s ease-in-out infinite;
}
.glow.red{
background:#0066ff;
top:8%;
left:5%;
}
.glow.blue{
background:#00c3ff;
bottom:8%;
right:5%;
animation-delay:4s;
}
@keyframes floatGlow{
0%,100%{ transform:translate(0,0) scale(1); }
50%{ transform:translate(35px,28px) scale(1.2); }
}

/* ===== SALJU JATUH LEMBUT ===== */
.snowflake{
position:fixed;
top:-20px;
color:#fff;
font-size:12px;
opacity:0.7;
pointer-events:none;
z-index:0;
user-select:none;
animation: snowfall linear infinite;
text-shadow:0 0 6px rgba(180,220,255,0.8);
}
@keyframes snowfall{
0%{
transform:translateY(0) translateX(0) rotate(0deg);
opacity:0;
}
10%{
opacity:0.8;
}
90%{
opacity:0.6;
}
100%{
transform:translateY(110vh) translateX(30px) rotate(360deg);
opacity:0;
}
}

.container{
width:100%;
max-width:400px;
padding:10px 5px;
text-align:center;
position:relative;
z-index:1;
}

/* Foto */
.photo{
width:160px;
height:160px;
object-fit:cover;
border-radius:20px;
margin:0 auto 18px;
border:3px solid rgba(0,160,255,0.4);
box-shadow:
0 0 20px rgba(0,120,255,0.45),
0 0 40px rgba(0,80,200,0.25);
display:block;
}

/* Judul */
.welcome{
color:#e8f4ff;
font-size:24px;
font-weight:bold;
margin-bottom:25px;
text-shadow:
0 0 12px rgba(0,160,255,0.7),
0 0 25px rgba(0,100,255,0.4);
letter-spacing:0.5px;
line-height:1.35;
}
.welcome span{
display:block;
font-size:20px;
font-weight:800;
margin-top:6px;
background:linear-gradient(90deg,#4da6ff,#00d4ff,#7ec8ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
}

/* Tombol */
.btn{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 18px;
margin:14px 0;
text-decoration:none;
color:white;
border-radius:16px;
font-size:16px;
font-weight:bold;
background:linear-gradient(135deg,#0066ff,#00a8ff);
box-shadow:
0 0 14px rgba(0,120,255,0.45),
0 4px 12px rgba(0,60,180,0.3);
transition: all 0.3s ease;
position:relative;
overflow:hidden;
user-select:none;
}
.btn:nth-child(2){ background:linear-gradient(135deg,#0055dd,#0088ee); }
.btn:nth-child(3){ background:linear-gradient(135deg,#0077ff,#00c3ff); }
.btn:nth-child(4){ background:linear-gradient(135deg,#0044bb,#0099ff); }
.btn:nth-child(5){ background:linear-gradient(135deg,#0033aa,#00aaff); }

/* ===== HOVER: TOMBOL MEMBESAR ===== */
.btn:hover{
transform: scale(1.06);
box-shadow:
0 0 22px rgba(0,160,255,0.6),
0 8px 20px rgba(0,80,200,0.4);
filter:brightness(1.12);
}
.btn:hover .arrow{
background:rgba(255,255,255,.35);
transform:scale(1.15);
}

.btn:active{
transform: scale(0.96);
filter:brightness(1.05);
}

/* ===== RIPPLE EFFECT ===== */
.ripple{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,0.4);
transform:scale(0);
animation:ripple-animation 0.6s linear;
pointer-events:none;
}
@keyframes ripple-animation{
to{
transform:scale(4);
opacity:0;
}
}

.arrow{
width:40px;
height:40px;
display:flex;
justify-content:center;
align-items:center;
border-radius:50%;
background:rgba(255,255,255,.18);
font-size:20px;
flex-shrink:0;
transition:0.3s;
}
.btn:active .arrow{
background:rgba(255,255,255,.3);
transform:scale(1.1);
}

/* Responsive */
@media (max-width:380px){
.photo{ width:140px; height:140px; }
.welcome{ font-size:21px; }
.welcome span{ font-size:18px; }
.btn{ padding:15px 16px; font-size:15px; }
.arrow{ width:36px; height:36px; font-size:18px; }
}
@media (min-width:420px){
.photo{ width:175px; height:175px; }
.welcome{ font-size:26px; }
}
</style>
</head>
<body>
<!-- LATAR BIRU DARK -->
<div class="bg-animation"></div>
<div class="web"></div>
<div class="glow red"></div>
<div class="glow blue"></div>

<div class="container">
  <img src="https://i.postimg.cc/rpcwK3NN/Chat-GPT-Image-15-Jun-2026-02-00-40.png" alt="Tampan Slot" class="photo">
  <div class="welcome">
    Selamat Datang di<br>
    <span>TAMPAN SLOT</span>
  </div>
  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">
    LOGIN
    <span class="arrow">➜</span>
  </a>
  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">
    LINK UTAMA
    <span class="arrow">➜</span>
  </a>
  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">
    LINK GACOR
    <span class="arrow">➜</span>
  </a>
  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">
    BONUS TERBARU
    <span class="arrow">➜</span>
  </a>
</div>

<script>
// ===== SALJU BANYAK & LEMBUT =====
function createSnowflakes() {
  const snowCount = 60; // banyak salju
  const symbols = ['❄', '❅', '❆', '•', '·'];

  for (let i = 0; i < snowCount; i++) {
    const flake = document.createElement('div');
    flake.classList.add('snowflake');
    flake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];

    // Posisi horizontal acak
    flake.style.left = Math.random() * 100 + 'vw';

    // Ukuran acak (kecil - sedang)
    const size = Math.random() * 14 + 8;
    flake.style.fontSize = size + 'px';

    // Opacity lembut
    flake.style.opacity = Math.random() * 0.5 + 0.3;

    // Durasi jatuh (lambat & lembut)
    const duration = Math.random() * 12 + 10; // 10-22 detik
    flake.style.animationDuration = duration + 's';

    // Delay acak supaya tidak bareng
    flake.style.animationDelay = Math.random() * 15 + 's';

    // Goyangan horizontal sedikit berbeda
    const drift = (Math.random() * 60 - 30) + 'px';
    flake.style.setProperty('--drift', drift);

    document.body.appendChild(flake);
  }
}

// Update animasi supaya ada goyangan
const style = document.createElement('style');
style.innerHTML = `
@keyframes snowfall{
0%{
transform:translateY(-10vh) translateX(0) rotate(0deg);
opacity:0;
}
10%{
opacity:0.75;
}
90%{
opacity:0.5;
}
100%{
transform:translateY(110vh) translateX(var(--drift, 20px)) rotate(360deg);
opacity:0;
}
}`;
document.head.appendChild(style);

createSnowflakes();

// ===== RIPPLE EFFECT =====
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    const oldRipple = this.querySelector('.ripple');
    if (oldRipple) oldRipple.remove();

    const ripple = document.createElement('span');
    ripple.classList.add('ripple');

    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;

    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';

    this.appendChild(ripple);

    setTimeout(() => {
      ripple.remove();
    }, 600);
  });
});
</script>
</body>
</html>
