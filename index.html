<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d1117;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.menu{
    width:100%;
    max-width:420px;
    padding:20px;
}

.btn{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-decoration:none;
    color:#fff;
    padding:18px 22px;
    margin:15px 0;
    border-radius:18px;
    overflow:hidden;
    font-size:18px;
    font-weight:700;
    letter-spacing:.5px;
    transition:.35s;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:80%;
    height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-25deg);
    transition:.7s;
}

.btn:hover::before{
    left:140%;
}

.btn:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 14px 35px rgba(0,0,0,.45);
}

.icon{
    width:42px;
    height:42px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    transition:.3s;
}

.btn:hover .icon{
    transform:translateX(6px) rotate(-8deg);
    background:rgba(255,255,255,.3);
}

/* Warna */

.blue{
    background:linear-gradient(135deg,#2196f3,#1565c0);
}

.purple{
    background:linear-gradient(135deg,#8e24aa,#5e35b1);
}

.red{
    background:linear-gradient(135deg,#ff5252,#d50000);
}

.green{
    background:linear-gradient(135deg,#00c853,#2e7d32);
}

@media(max-width:480px){

.btn{
    font-size:16px;
    padding:16px 18px;
}

.icon{
    width:38px;
    height:38px;
}
}
</style>

</head>
<body>

<div class="menu">

<a class="btn blue" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
    <span>LOGIN</span>
    <div class="icon">➜</div>
</a>

<a class="btn purple" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
    <span>LINK UTAMA</span>
    <div class="icon">➜</div>
</a>

<a class="btn red" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
    <span>INFORMASI</span>
    <div class="icon">➜</div>
</a>

<a class="btn green" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
    <span>HUBUNGI KAMI</span>
    <div class="icon">➜</div>
</a>

</div>

</body>
</html>
