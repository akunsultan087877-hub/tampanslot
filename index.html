<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0d1117;
font-family:Arial,Helvetica,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.menu{
width:100%;
max-width:420px;
}

/* Banner */
.logo{
width:100%;
overflow:hidden;
border-radius:22px;
margin-bottom:22px;
box-shadow:0 15px 40px rgba(0,0,0,.5);
}

.logo img{
width:100%;
display:block;
transition:.4s;
}

.logo:hover img{
transform:scale(1.03);
}

/* Tombol */
.btn{
position:relative;
display:flex;
justify-content:space-between;
align-items:center;
text-decoration:none;
color:#fff;
padding:18px 22px;
margin:15px 0;
border-radius:18px;
font-size:18px;
font-weight:bold;
overflow:hidden;
transition:.35s;
box-shadow:0 8px 25px rgba(0,0,0,.35);
}

.btn::before{
content:"";
position:absolute;
top:0;
left:-120%;
width:70%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
transform:skewX(-25deg);
transition:.8s;
}

.btn:hover::before{
left:150%;
}

.btn:hover{
transform:translateY(-4px);
box-shadow:0 15px 35px rgba(0,0,0,.5);
}

.icon{
width:42px;
height:42px;
display:flex;
align-items:center;
justify-content:center;
background:rgba(255,255,255,.18);
border-radius:50%;
font-size:20px;
transition:.3s;
}

.btn:hover .icon{
transform:translateX(5px);
background:rgba(255,255,255,.28);
}

.blue{
background:linear-gradient(135deg,#28a9ff,#0058c8);
}

.purple{
background:linear-gradient(135deg,#a54dff,#5d22d7);
}

.red{
background:linear-gradient(135deg,#ff6464,#d10000);
}

.green{
background:linear-gradient(135deg,#00db7a,#008f4b);
}

@media(max-width:480px){

.btn{
padding:16px 18px;
font-size:16px;
}

.icon{
width:38px;
height:38px;
}

}
</style>

</head>
<body>

<div class="menu">

<div class="logo">
<img src="banner.png" alt="TAMPANSLOT">
</div>

<a class="btn blue" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
<span>LOGIN</span>
<div class="icon">➜</div>
</a>

<a class="btn purple" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
<span>LINK UTAMA</span>
<div class="icon">➜</div>
</a>

<a class="btn red" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
<span>INFORMASI</span>
<div class="icon">➜</div>
</a>

<a class="btn green" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
<span>HUBUNGI KAMI</span>
<div class="icon">➜</div>
</a>

</div>

</body>
</html>
