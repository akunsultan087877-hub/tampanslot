<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Landing</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
background:#050816;
}

/* Background Animasi */

body::before{
content:"";
position:fixed;
width:220%;
height:220%;
background:
radial-gradient(circle,#ff000055 0%,transparent 35%),
radial-gradient(circle,#0066ff55 0%,transparent 35%),
radial-gradient(circle,#00ffff33 0%,transparent 30%);
background-size:30% 30%;
animation:movebg 18s linear infinite;
z-index:-2;
filter:blur(25px);
}

@keyframes movebg{

0%{
transform:rotate(0deg) scale(1);
}

100%{
transform:rotate(360deg) scale(1.2);
}

}

/* Partikel */

.particle{
position:fixed;
width:5px;
height:5px;
background:white;
border-radius:50%;
opacity:.5;
animation:float 12s linear infinite;
z-index:-1;
}

@keyframes float{

0%{
transform:translateY(110vh);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}

.container{

width:420px;
max-width:95%;
padding:25px;

}

/* Tombol */

.btn{

display:flex;
justify-content:space-between;
align-items:center;
padding:18px 22px;
margin:18px 0;

text-decoration:none;
color:white;

border-radius:18px;

font-size:18px;
font-weight:bold;

background:linear-gradient(135deg,#ff003c,#0048ff);

box-shadow:
0 0 15px rgba(255,0,60,.5),
0 0 30px rgba(0,72,255,.35);

transition:.35s;

position:relative;
overflow:hidden;

}

.btn:before{

content:"";
position:absolute;
left:-120%;
top:0;

width:60%;
height:100%;

background:
linear-gradient(90deg,
transparent,
rgba(255,255,255,.6),
transparent);

transform:skewX(-30deg);

transition:.8s;

}

.btn:hover:before{

left:160%;

}

.btn:hover{

transform:translateY(-5px) scale(1.03);

box-shadow:
0 0 25px red,
0 0 45px blue;

}

.arrow{

width:45px;
height:45px;

display:flex;
justify-content:center;
align-items:center;

border-radius:50%;

background:rgba(255,255,255,.18);

font-size:22px;

}

</style>
</head>

<body>

<div class="particle" style="left:5%;animation-delay:0s"></div>
<div class="particle" style="left:15%;animation-delay:2s"></div>
<div class="particle" style="left:25%;animation-delay:4s"></div>
<div class="particle" style="left:35%;animation-delay:1s"></div>
<div class="particle" style="left:45%;animation-delay:5s"></div>
<div class="particle" style="left:55%;animation-delay:3s"></div>
<div class="particle" style="left:65%;animation-delay:6s"></div>
<div class="particle" style="left:75%;animation-delay:2s"></div>
<div class="particle" style="left:85%;animation-delay:4s"></div>
<div class="particle" style="left:95%;animation-delay:1s"></div>

<div class="container">

<a class="btn" href="#">
LOGIN
<span class="arrow">➜</span>
</a>

<a class="btn" href="#">
LINK UTAMA
<span class="arrow">➜</span>
</a>

<a class="btn" href="#">
LINK GACOR
<span class="arrow">➜</span>
</a>

<a class="btn" href="#">
BONUS TERBARU
<span class="arrow">➜</span>
</a>

</div>

</body>
</html>
