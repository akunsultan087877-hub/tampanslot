<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TAMPAN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:#34382f;
background-image:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35));
}

.card{
width:360px;
padding:30px;
}

.logo{
width:90px;
height:90px;
border-radius:50%;
overflow:hidden;
margin-bottom:20px;
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
}

.small{
color:#ccc;
letter-spacing:6px;
font-size:12px;
margin-bottom:10px;
}

h1{
color:#fff;
font-size:52px;
margin-bottom:25px;
}

.btn{
display:flex;
justify-content:space-between;
align-items:center;
text-decoration:none;
color:#fff;
padding:18px 25px;
border-radius:40px;
font-weight:600;
margin-bottom:20px;
transition:.3s;
}

.btn:hover{
transform:scale(1.03);
}

.blue{
background:linear-gradient(90deg,#34b5ff,#4d8cff);
}

.purple{
background:linear-gradient(90deg,#695bff,#6f7dff);
}

.red{
background:linear-gradient(90deg,#ff3c5f,#ff4b6b);
}

.green{
background:linear-gradient(90deg,#00d84b,#19d85b);
}

.icon{
font-size:22px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
<img src="logo.png" alt="Logo">
</div>

<div class="small">
SITUS INDONESIA
</div>

<h1>TAMPAN</h1>

<a class="btn blue" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
<span>LOGIN</span>
<span class="icon">➜</span>
</a>

<a class="btn purple" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
<span>LINK TERBARU</span>
<span class="icon">⬢</span>
</a>

<a class="btn red" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
<span>LINK ALTERNATIF</span>
<span class="icon">◎</span>
</a>

<a class="btn green" href="https://tampanslot1.lat/daftar?ref=gantengkali2" target="_blank">
<span>PROMO TERBARU</span>
<span class="icon">🎁</span>
</a>

</div>

</body>
</html>
