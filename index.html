<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tampan Slot</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
overflow:hidden;
background:#fff8e7;
padding:15px;
position:relative;
}

/* ===== LATAR GEMBIRA ===== */
.bg-animation{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-3;
background:
radial-gradient(circle at 20% 30%, rgba(255,182,193,0.55) 0%, transparent 45%),
radial-gradient(circle at 80% 20%, rgba(255,223,100,0.5) 0%, transparent 40%),
radial-gradient(circle at 70% 80%, rgba(173,216,230,0.55) 0%, transparent 45%),
radial-gradient(circle at 30% 70%, rgba(144,238,144,0.45) 0%, transparent 40%),
#fff8e7;
animation: bgPulse 7s ease-in-out infinite alternate;
}
@keyframes bgPulse{
0%{ filter:hue-rotate(0deg) brightness(1); }
100%{ filter:hue-rotate(12deg) brightness(1.08); }
}

/* Pola confetti lembut */
.web{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
background-image:
radial-gradient(circle, rgba(255,105,180,0.15) 2px, transparent 2px),
radial-gradient(circle, rgba(255,215,0,0.15) 2px, transparent 2px),
radial-gradient(circle, rgba(100,200,255,0.15) 2px, transparent 2px);
background-size:50px 50px, 70px 70px, 40px 40px;
background-position:0 0, 25px 25px, 10px 40px;
animation: webMove 18s linear infinite;
opacity:0.7;
}
@keyframes webMove{
0%{ background-position:0 0, 25px 25px, 10px 40px; }
100%{ background-position:50px 50px, 75px 75px, 50px 80px; }
}

/* Cahaya cerah bergerak */
.glow{
position:fixed;
width:280px;
height:280px;
border-radius:50%;
filter:blur(70px);
z-index:-1;
opacity:0.55;
animation: floatGlow 10s ease-in-out infinite;
}
.glow.red{
background:#ff9ec4;
top:8%;
left:5%;
}
.glow.blue{
background:#7ec8ff;
bottom:8%;
right:5%;
animation-delay:3s;
}
@keyframes floatGlow{
0%,100%{ transform:translate(0,0) scale(1); }
50%{ transform:translate(30px,25px) scale(1.15); }
}

/* Partikel confetti */
.particle{
position:fixed;
width:8px;
height:8px;
border-radius:2px;
opacity:0.7;
animation:float 11s linear infinite;
z-index:0;
}
.particle:nth-child(odd){ background:#ff6b9d; transform:rotate(20deg); }
.particle:nth-child(even){ background:#ffd93d; border-radius:50%; }
.particle:nth-child(3n){ background:#6bcbff; }
.particle:nth-child(4n){ background:#95e1a3; }
@keyframes float{
0%{ transform:translateY(110vh) rotate(0deg); opacity:0; }
15%{ opacity:0.8; }
100%{ transform:translateY(-20vh) rotate(360deg); opacity:0; }
}

.container{
width:100%;
max-width:400px;
padding:10px 5px;
text-align:center;
position:relative;
z-index:1;
}

/* Foto */
.photo{
width:160px;
height:160px;
object-fit:cover;
border-radius:22px;
margin:0 auto 18px;
border:4px solid #fff;
box-shadow:
0 8px 25px rgba(255,105,180,0.35),
0 4px 12px rgba(255,200,50,0.3);
display:block;
}

/* Judul */
.welcome{
color:#2d2d2d;
font-size:24px;
font-weight:bold;
margin-bottom:25px;
text-shadow:
0 2px 0 #fff,
0 0 15px rgba(255,182,193,0.6);
letter-spacing:0.5px;
line-height:1.35;
}
.welcome span{
display:block;
font-size:20px;
font-weight:800;
margin-top:6px;
background:linear-gradient(90deg,#ff6b9d,#ff9f43,#6bcbff,#95e1a3);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
}

/* Tombol */
.btn{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 18px;
margin:14px 0;
text-decoration:none;
color:white;
border-radius:18px;
font-size:16px;
font-weight:bold;
background:linear-gradient(135deg,#ff6b9d,#ff9f43);
box-shadow:
0 6px 18px rgba(255,107,157,0.4),
0 3px 8px rgba(255,159,67,0.3);
transition: all 0.3s ease;
position:relative;
overflow:hidden;
user-select:none;
}
.btn:nth-child(2){ background:linear-gradient(135deg,#6bcbff,#4ecdc4); box-shadow:0 6px 18px rgba(107,203,255,0.4); }
.btn:nth-child(3){ background:linear-gradient(135deg,#95e1a3,#4ecdc4); box-shadow:0 6px 18px rgba(149,225,163,0.4); }
.btn:nth-child(4){ background:linear-gradient(135deg,#ff9f43,#ff6b9d); box-shadow:0 6px 18px rgba(255,159,67,0.4); }
.btn:nth-child(5){ background:linear-gradient(135deg,#c77dff,#ff6b9d); box-shadow:0 6px 18px rgba(199,125,255,0.4); }

/* ===== HOVER: TOMBOL MEMBESAR ===== */
.btn:hover{
transform: scale(1.06);
box-shadow:
0 10px 28px rgba(0,0,0,0.18),
0 6px 16px rgba(255,107,157,0.45);
filter:brightness(1.08);
}
.btn:nth-child(2):hover{ box-shadow:0 10px 28px rgba(0,0,0,0.18), 0 6px 16px rgba(107,203,255,0.5); }
.btn:nth-child(3):hover{ box-shadow:0 10px 28px rgba(0,0,0,0.18), 0 6px 16px rgba(149,225,163,0.5); }
.btn:nth-child(4):hover{ box-shadow:0 10px 28px rgba(0,0,0,0.18), 0 6px 16px rgba(255,159,67,0.5); }
.btn:nth-child(5):hover{ box-shadow:0 10px 28px rgba(0,0,0,0.18), 0 6px 16px rgba(199,125,255,0.5); }

.btn:hover .arrow{
background:rgba(255,255,255,.4);
transform:scale(1.15);
}

.btn:active{
transform: scale(0.96);
filter:brightness(1.05);
}

/* ===== RIPPLE EFFECT ===== */
.ripple{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,0.45);
transform:scale(0);
animation:ripple-animation 0.6s linear;
pointer-events:none;
}
@keyframes ripple-animation{
to{
transform:scale(4);
opacity:0;
}
}

.arrow{
width:40px;
height:40px;
display:flex;
justify-content:center;
align-items:center;
border-radius:50%;
background:rgba(255,255,255,.25);
font-size:20px;
flex-shrink:0;
transition:0.3s;
}
.btn:active .arrow{
background:rgba(255,255,255,.4);
transform:scale(1.1);
}

/* Responsive */
@media (max-width:380px){
.photo{ width:140px; height:140px; }
.welcome{ font-size:21px; }
.welcome span{ font-size:18px; }
.btn{ padding:15px 16px; font-size:15px; }
.arrow{ width:36px; height:36px; font-size:18px; }
}
@media (min-width:420px){
.photo{ width:175px; height:175px; }
.welcome{ font-size:26px; }
}
</style>
</head>
<body>
<!-- LATAR GEMBIRA -->
<div class="bg-animation"></div>
<div class="web"></div>
<div class="glow red"></div>
<div class="glow blue"></div>

<!-- Partikel confetti -->
<div class="particle" style="left:5%;animation-delay:0s"></div>
<div class="particle" style="left:15%;animation-delay:2s"></div>
<div class="particle" style="left:25%;animation-delay:4s"></div>
<div class="particle" style="left:35%;animation-delay:1s"></div>
<div class="particle" style="left:45%;animation-delay:5s"></div>
<div class="particle" style="left:55%;animation-delay:3s"></div>
<div class="particle" style="left:65%;animation-delay:6s"></div>
<div class="particle" style="left:75%;animation-delay:2s"></div>
<div class="particle" style="left:85%;animation-delay:4s"></div>
<div class="particle" style="left:95%;animation-delay:1s"></div>

<div class="container">
  <img src="https://i.postimg.cc/rpcwK3NN/Chat-GPT-Image-15-Jun-2026-02-00-40.png" alt="Tampan Slot" class="photo">
  <div class="welcome">
    Selamat Datang di<br>
    <span>TAMPAN SLOT</span>
  </div>
  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">
    LOGIN
    <span class="arrow">➜</span>
  </a>
  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">
    LINK UTAMA
    <span class="arrow">➜</span>
  </a>
  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">
    LINK GACOR
    <span class="arrow">➜</span>
  </a>
  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">
    BONUS TERBARU
    <span class="arrow">➜</span>
  </a>
</div>

<script>
// Efek Ripple saat tombol diklik
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    // Hapus ripple lama jika ada
    const oldRipple = this.querySelector('.ripple');
    if (oldRipple) oldRipple.remove();

    const ripple = document.createElement('span');
    ripple.classList.add('ripple');

    const rect = this.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = e.clientX - rect.left - size / 2;
    const y = e.clientY - rect.top - size / 2;

    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';

    this.appendChild(ripple);

    // Hapus setelah animasi selesai
    setTimeout(() => {
      ripple.remove();
    }, 600);
  });
});
</script>
</body>
</html>
