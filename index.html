<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tampan Slot</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
-webkit-tap-highlight-color:transparent;
}
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
overflow:hidden;
background:#050816;
padding:15px;
position:relative;
}

/* ===== ANIMASI LATAR SPIDER-MAN ===== */
.bg-animation{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-3;
background:
radial-gradient(circle at 20% 30%, rgba(255,0,40,0.35) 0%, transparent 40%),
radial-gradient(circle at 80% 70%, rgba(0,80,255,0.35) 0%, transparent 40%),
radial-gradient(circle at 50% 50%, rgba(255,0,80,0.15) 0%, transparent 50%),
#050816;
animation: bgPulse 8s ease-in-out infinite alternate;
}

@keyframes bgPulse{
0%{
filter:hue-rotate(0deg) brightness(1);
}
100%{
filter:hue-rotate(15deg) brightness(1.15);
}
}

/* Web / garis Spider-Man */
.web{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
background-image:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
background-size:60px 60px;
animation: webMove 20s linear infinite;
opacity:0.6;
}

@keyframes webMove{
0%{ background-position:0 0; }
100%{ background-position:60px 60px; }
}

/* Cahaya merah-biru bergerak */
.glow{
position:fixed;
width:300px;
height:300px;
border-radius:50%;
filter:blur(80px);
z-index:-1;
opacity:0.5;
animation: floatGlow 12s ease-in-out infinite;
}
.glow.red{
background:#ff003c;
top:10%;
left:10%;
}
.glow.blue{
background:#0048ff;
bottom:10%;
right:10%;
animation-delay:4s;
}

@keyframes floatGlow{
0%,100%{ transform:translate(0,0) scale(1); }
50%{ transform:translate(40px,30px) scale(1.2); }
}

/* Partikel */
.particle{
position:fixed;
width:3px;
height:3px;
background:white;
border-radius:50%;
opacity:.5;
animation:float 12s linear infinite;
z-index:0;
}
@keyframes float{
0%{ transform:translateY(110vh); opacity:0; }
20%{ opacity:1; }
100%{ transform:translateY(-20vh); opacity:0; }
}

.container{
width:100%;
max-width:400px;
padding:10px 5px;
text-align:center;
position:relative;
z-index:1;
}

/* Foto */
.photo{
width:160px;
height:160px;
object-fit:cover;
border-radius:18px;
margin:0 auto 18px;
border:3px solid rgba(255,255,255,0.25);
box-shadow:
0 0 18px rgba(255,0,60,0.5),
0 0 35px rgba(0,72,255,0.35);
display:block;
}

/* Judul */
.welcome{
color:white;
font-size:24px;
font-weight:bold;
margin-bottom:25px;
text-shadow:
0 0 10px #ff003c,
0 0 20px #0048ff,
0 0 30px #00ffff;
letter-spacing:0.5px;
line-height:1.35;
}
.welcome span{
display:block;
font-size:17px;
font-weight:normal;
margin-top:5px;
opacity:0.9;
}

/* Tombol */
.btn{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 18px;
margin:14px 0;
text-decoration:none;
color:white;
border-radius:16px;
font-size:16px;
font-weight:bold;
background:linear-gradient(135deg,#ff003c,#0048ff);
box-shadow:
0 0 12px rgba(255,0,60,.45),
0 0 25px rgba(0,72,255,.3);
transition: all 0.25s ease;
position:relative;
overflow:hidden;
user-select:none;
}
.btn:before{
content:"";
position:absolute;
left:-120%;
top:0;
width:60%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
transform:skewX(-30deg);
transition:.6s;
}
.btn:active{
transform: scale(0.94);
box-shadow:
0 0 8px rgba(255,0,60,.7),
0 0 20px rgba(0,72,255,.5),
inset 0 0 20px rgba(0,0,0,0.3);
background:linear-gradient(135deg,#e60036,#003dcc);
}
.btn:active:before{
left:160%;
}
.btn:after{
content:"";
position:absolute;
width:0;
height:0;
border-radius:50%;
background:rgba(255,255,255,0.25);
transform:translate(-50%,-50%);
transition: width 0.4s ease, height 0.4s ease;
top:50%;
left:50%;
pointer-events:none;
}
.btn:active:after{
width:300px;
height:300px;
}
.arrow{
width:40px;
height:40px;
display:flex;
justify-content:center;
align-items:center;
border-radius:50%;
background:rgba(255,255,255,.18);
font-size:20px;
flex-shrink:0;
transition:0.25s;
}
.btn:active .arrow{
background:rgba(255,255,255,.3);
transform:scale(1.1);
}

/* Responsive */
@media (max-width:380px){
.photo{ width:140px; height:140px; }
.welcome{ font-size:21px; }
.welcome span{ font-size:15px; }
.btn{ padding:15px 16px; font-size:15px; }
.arrow{ width:36px; height:36px; font-size:18px; }
}
@media (min-width:420px){
.photo{ width:175px; height:175px; }
.welcome{ font-size:26px; }
}
</style>
</head>
