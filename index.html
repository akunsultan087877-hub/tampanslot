<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Landing Page</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:#2e3328;
background-image:
linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
repeating-linear-gradient(135deg,
rgba(255,255,255,.03) 0,
rgba(255,255,255,.03) 2px,
transparent 2px,
transparent 60px);
}

.card{
width:360px;
background:rgba(0,0,0,.18);
backdrop-filter:blur(8px);
border-radius:22px;
padding:30px;
box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.logo{
width:90px;
height:90px;
border-radius:50%;
overflow:hidden;
border:4px solid rgba(255,255,255,.2);
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
}

.small{
margin-top:20px;
letter-spacing:5px;
color:#d9d9d9;
font-size:12px;
}

h1{
margin-top:10px;
color:#fff;
font-size:48px;
font-weight:700;
}

.btn{
display:flex;
justify-content:space-between;
align-items:center;
text-decoration:none;
color:#fff;
padding:18px 25px;
border-radius:50px;
margin-top:20px;
font-weight:600;
transition:.25s;
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.blue{
background:linear-gradient(90deg,#3db4ff,#4b8dff);
}

.purple{
background:linear-gradient(90deg,#6557ff,#7278ff);
}

.red{
background:linear-gradient(90deg,#ff375e,#ff4b70);
}

.green{
background:linear-gradient(90deg,#00d84f,#19d857);
}

.icon{
font-size:22px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
<img src="https://via.placeholder.com/300x300.png?text=LOGO">
</div>

<div class="small">
SITUS INDONESIA
</div>

<h1>TAMPAN</h1>

<a class="btn blue" href="#">
<span>LOGIN</span>
<span class="icon">➜</span>
</a>

<a class="btn purple" href="#">
<span>LINK TERBARU</span>
<span class="icon">⬢</span>
</a>

<a class="btn red" href="#">
<span>LINK ALTERNATIF</span>
<span class="icon">◎</span>
</a>

<a class="btn green" href="#">
<span>PROMO TERBARU</span>
<span class="icon">🎁</span>
</a>

</div>

</body>
</html>
