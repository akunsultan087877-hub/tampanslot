<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Landing</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
background:#050816;
}
body::before{
content:"";
position:fixed;
width:220%;
height:220%;
background:
radial-gradient(circle,#ff000055 0%,transparent 35%),
radial-gradient(circle,#0066ff55 0%,transparent 35%),
radial-gradient(circle,#00ffff33 0%,transparent 30%);
background-size:30% 30%;
animation:movebg 18s linear infinite;
z-index:-2;
filter:blur(25px);
}
@keyframes movebg{
0%{ transform:rotate(0deg) scale(1); }
100%{ transform:rotate(360deg) scale(1.2); }
}
.particle{
position:fixed;
width:5px;
height:5px;
background:white;
border-radius:50%;
opacity:.5;
animation:float 12s linear infinite;
z-index:-1;
}
@keyframes float{
0%{ transform:translateY(110vh); opacity:0; }
20%{ opacity:1; }
100%{ transform:translateY(-120vh); opacity:0; }
}
.container{
width:420px;
max-width:95%;
padding:25px;
text-align:center;
}
/* Foto */
.photo{
width:180px;
height:180px;
object-fit:cover;
border-radius:20px;
margin:0 auto 20px;
border:3px solid rgba(255,255,255,0.3);
box-shadow:
0 0 20px rgba(255,0,60,0.5),
0 0 40px rgba(0,72,255,0.4);
}
/* Judul */
.welcome{
color:white;
font-size:26px;
font-weight:bold;
margin-bottom:30px;
text-shadow:
0 0 10px #ff003c,
0 0 20px #0048ff,
0 0 30px #00ffff;
letter-spacing:1px;
line-height:1.4;
}
.welcome span{
display:block;
font-size:18px;
font-weight:normal;
margin-top:6px;
opacity:0.9;
}
/* Tombol */
.btn{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 22px;
margin:18px 0;
text-decoration:none;
color:white;
border-radius:18px;
font-size:18px;
font-weight:bold;
background:linear-gradient(135deg,#ff003c,#0048ff);
box-shadow:
0 0 15px rgba(255,0,60,.5),
0 0 30px rgba(0,72,255,.35);
transition:.35s;
position:relative;
overflow:hidden;
}
.btn:before{
content:"";
position:absolute;
left:-120%;
top:0;
width:60%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);
transform:skewX(-30deg);
transition:.8s;
}
.btn:hover:before{ left:160%; }
.btn:hover{
transform:translateY(-5px) scale(1.03);
box-shadow:0 0 25px red, 0 0 45px blue;
}
.arrow{
width:45px;
height:45px;
display:flex;
justify-content:center;
align-items:center;
border-radius:50%;
background:rgba(255,255,255,.18);
font-size:22px;
}
</style>
</head>
<body>
<div class="particle" style="left:5%;animation-delay:0s"></div>

<div class="particle" style="left:65%;animation-delay:6s"></div>
<div class="particle" style="left:75%;animation-delay:2s"></div>
<div class="particle" style="left:85%;animation-delay:4s"></div>
<div class="particle" style="left:95%;animation-delay:1s"></div>

<div class="container">

  <img src="https://i.postimg.cc/rpcwK3NN/Chat-GPT-Image-15-Jun-2026-02-00-40.png" alt="Tampan Slot" class="photo">

  <div class="welcome">
    Selamat Datang di<br>
    <span>TAMPAN SLOT</span>
  </div>

  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">

  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">
    LINK GACOR

  </a>
  <a class="btn" href="https://tampanslot1.lat/daftar?ref=gantengkali2">

  </a>
</div>
</body>
</html>
