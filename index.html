<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:
radial-gradient(circle at top,#2b2b2b 0%,#111 40%,#000 100%);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:25px;
overflow-x:hidden;
position:relative;
}

/* Efek jaring */
body::before{
content:"";
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
background-size:45px 45px;
opacity:.25;
pointer-events:none;
}

.menu{
width:100%;
max-width:430px;
background:rgba(15,15,15,.9);
border:2px solid #c40018;
border-radius:28px;
padding:20px;
box-shadow:
0 0 20px rgba(255,0,0,.4),
0 0 60px rgba(0,80,255,.25);
}

/* Banner */

.logo{
overflow:hidden;
border-radius:18px;
margin-bottom:22px;
border:3px solid #d6001c;
box-shadow:0 0 25px rgba(255,0,0,.45);
}

.logo img{
width:100%;
display:block;
transition:.5s;
}

.logo:hover img{
transform:scale(1.05);
}

/* Tombol */

.btn{
position:relative;
display:flex;
justify-content:space-between;
align-items:center;
text-decoration:none;
padding:18px 22px;
margin:15px 0;
border-radius:16px;
font-size:18px;
font-weight:700;
color:#fff;
overflow:hidden;
transition:.35s;
border:1px solid rgba(255,255,255,.12);
}

.btn::before{
content:"";
position:absolute;
left:-120%;
top:0;
width:70%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
transform:skewX(-25deg);
transition:.8s;
}

.btn:hover::before{
left:150%;
}

.btn:hover{
transform:translateY(-4px) scale(1.02);
}

.icon{
width:45px;
height:45px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
background:rgba(255,255,255,.15);
font-size:20px;
transition:.3s;
}

.btn:hover .icon{
transform:rotate(-15deg);
background:#fff;
color:#d4001d;
}

/* Warna Spider */

.blue{
background:linear-gradient(135deg,#0046c7,#001f6d);
box-shadow:0 0 18px rgba(0,102,255,.45);
}

.purple{
background:linear-gradient(135deg,#d00020,#6b0012);
box-shadow:0 0 18px rgba(255,0,43,.45);
}

.red{
background:linear-gradient(135deg,#ff1f3d,#8b0000);
box-shadow:0 0 18px rgba(255,0,0,.45);
}

.green{
background:linear-gradient(135deg,#0b5cff,#001c60);
box-shadow:0 0 18px rgba(0,119,255,.45);
}

.footer{
margin-top:18px;
text-align:center;
font-size:13px;
font-weight:600;
color:#ffffff;
letter-spacing:2px;
text-shadow:0 0 10px red;
}

@media(max-width:480px){

.menu{
padding:16px;
}

.btn{
font-size:16px;
padding:16px 18px;
}

.icon{
width:40px;
height:40px;
}

}
</style>
